<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 外圈环：紫蓝光晕（内外缘协调） -->
    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#5a4a9a" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 中心蓝盘：径向渐变、略凸感 -->
    <radialGradient id="glowCircle" cx="45%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#a8d4ff"/>
      <stop offset="30%" style="stop-color:#6eb0ff"/>
      <stop offset="60%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </radialGradient>
    <filter id="circleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Z：亮白 + 轻微蓝光晕 -->
    <linearGradient id="zFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#e8ecf0"/>
    </linearGradient>
    <filter id="zGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#93c5ff" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 按比例缩小，使整体（含光晕）不超出范围，居中 -->
  <g transform="translate(100,100) scale(0.85) translate(-100,-100)">
    <!-- 外圈紫蓝光晕层（与背景、蓝盘过渡协调） -->
    <circle cx="100" cy="100" r="106" fill="#4a3d7a" opacity="0.35" filter="url(#ringGlow)"/>
    <!-- 深色紫靛环 -->
    <circle cx="100" cy="100" r="100" fill="#1e1b2e" filter="url(#ringGlow)"/>
    <!-- 环内缘过渡光（与蓝盘衔接） -->
    <circle cx="100" cy="100" r="76" fill="#3d4a6a" opacity="0.25" filter="url(#ringGlow)"/>
    <!-- 中心蓝盘 -->
    <circle cx="100" cy="100" r="72" fill="url(#glowCircle)" filter="url(#circleGlow)"/>
    <!-- 中心 Z（带轻微蓝光晕） -->
    <path d="M 62 78 L 138 78 L 62 122 L 138 122" 
          fill="none" 
          stroke="url(#zFill)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#zGlow)"/>
  </g>
</svg>
