server:
  port: 8000
  servlet:
    context-path: /system/service

spring:
  application:
    name: zeros-backend
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

# DISK 路径配置
# 注意：路径是相对于 SpringBoot 运行时的当前工作目录
# 如果从 backend-java 目录运行（推荐），使用 ../DISK
# 如果从项目根目录运行，需要修改为 system/service/DISK
# 如果作为 jar 包运行，建议使用绝对路径或相对于 jar 包位置的路径
disk:
  #base-path: ../DISK
  base-path: system/service/DISK
  system-partition: D
  system-resource-zip: ../test/assets/SYSTEMRESOURCE.zip

# JWT 配置
jwt:
  secret: zeros-default-secret-change-in-production-min-256-bits
  expiration-seconds: 7200
  issuer: zeros-system
  exclude-paths:
    - /api/auth/**
    - /DISK/**
    - /randomSecurity
    - /randomSecurity/**
    - /module-proxy
    - /module-proxy/**
    - /ImageProxy
    - /ImageProxy/**
    - /audio-proxy
    - /audio-proxy/**
    - /spark-ai-proxy
    - /spark-ai-proxy/**
    - /dashscope-ai-proxy
    - /dashscope-ai-proxy/**
    - /BrowserProxy
    - /BrowserProxy/**
    - /test
    - /test/**
    - /error
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**

logging:
  level:
    cn.zeros: info
    org.springframework.web: info
