server:
  port: 8080
  servlet:
    context-path: /system/service

spring:
  application:
    name: zeros-backend
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

# DISK 路径配置
disk:
  base-path: ../DISK
  system-partition: D
  system-resource-zip: ../test/assets/SYSTEMRESOURCE.zip

# JWT 配置
jwt:
  secret: zeros-default-secret-change-in-production-min-256-bits
  expiration-seconds: 7200
  issuer: zeros-system
  exclude-paths:
    - /api/auth/**
    - /randomSecurity
    - /randomSecurity/**
    - /module-proxy
    - /module-proxy/**
    - /ImageProxy
    - /ImageProxy/**
    - /audio-proxy
    - /audio-proxy/**
    - /spark-ai-proxy
    - /spark-ai-proxy/**
    - /dashscope-ai-proxy
    - /dashscope-ai-proxy/**
    - /BrowserProxy
    - /BrowserProxy/**
    - /test
    - /test/**
    - /error
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**

logging:
  level:
    cn.zeros: info
    org.springframework.web: info
