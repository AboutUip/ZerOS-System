<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="copyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <filter id="copyShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 底层文档 -->
  <rect x="5" y="7" width="13" height="13" rx="2" fill="#4A90E2" fill-opacity="0.3" filter="url(#copyShadow)"/>
  <!-- 顶层文档 -->
  <rect x="6" y="6" width="13" height="13" rx="2" fill="url(#copyGradient)" filter="url(#copyShadow)"/>
  <!-- 文档内容线 -->
  <line x1="9" y1="10" x2="15" y2="10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="9" y1="13" x2="15" y2="13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="9" y1="16" x2="13" y2="16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>
