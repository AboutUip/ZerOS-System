<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#171a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="210" x2="340" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="cool" x1="168" y1="170" x2="360" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3c82ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#bg)"/>
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#cool)" opacity="0.55"/>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M256 122c52 32 108 44 136 48v112c0 88-58 156-136 188C178 438 120 370 120 282V170c28-4 84-16 136-48z"
          fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.78)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M256 150c44 26 92 36 116 40v92c0 74-48 132-116 160-68-28-116-86-116-160v-92c24-4 72-14 116-40z"
          fill="rgba(255,255,255,0.04)" stroke="rgba(122,162,255,0.55)" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Strawberry emblem -->
  <g>
    <!-- leaf -->
    <path d="M256 232c-18-22-52-22-70-2 8-28 40-46 70-32 30-14 62 4 70 32-18-20-52-20-70 2z"
          fill="#3ddc84" opacity="0.9"/>
    <!-- body -->
    <path d="M256 248c-44 0-78 34-78 78 0 56 44 98 78 118 34-20 78-62 78-118 0-44-34-78-78-78z"
          fill="url(#accent)"/>
    <!-- seeds -->
    <g fill="rgba(255,255,255,0.78)">
      <ellipse cx="222" cy="306" rx="6" ry="8"/>
      <ellipse cx="256" cy="292" rx="6" ry="8"/>
      <ellipse cx="290" cy="306" rx="6" ry="8"/>
      <ellipse cx="236" cy="338" rx="6" ry="8"/>
      <ellipse cx="276" cy="338" rx="6" ry="8"/>
      <ellipse cx="256" cy="368" rx="6" ry="8"/>
    </g>
  </g>

  <!-- Checkmark -->
  <path d="M206 334l30 30 72-84" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
