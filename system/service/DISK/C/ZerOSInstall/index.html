        const InstallState = {

            STEP_AGREEMENT: 'agreement',
            STEP_ENV_SELECT: 'env_select',
            STEP_EXTRACT: 'extract',
            STEP_DISK_INIT: 'disk_init',
            STEP_USER_SETUP: 'user_setup',
            STEP_COMPLETE: 'complete'
        };
        
        // 工具函数：格式化字节大小
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // 工具函数：解析字节大小（支持GB/MB等）
        function parseBytes(sizeStr) {
            const match = sizeStr.match(/^(\d+(?:\.\d+)?)\s*(B|KB|MB|GB|TB)$/i);
            if (!match) return null;
            const value = parseFloat(match[1]);
            const unit = match[2].toUpperCase();
            const multipliers = { B: 1, KB: 1024, MB: 1024*1024, GB: 1024*1024*1024, TB: 1024*1024*1024*1024 };
            return Math.floor(value * multipliers[unit]);
        }
        
        // 工具函数：获取当前步骤
        function getCurrentStep() {
            return localStorage.getItem('install_step') || InstallState.STEP_LANGUAGE;
        }
        
        // 工具函数：设置当前步骤
        function setCurrentStep(step) {
            localStorage.setItem('install_step', step);
        }
        
        // 工具函数：获取安装配置
        function getInstallConfig() {
            const config = localStorage.getItem('install_config');
            return config ? JSON.parse(config) : null;
        }
        
        // 工具函数：保存安装配置
        function saveInstallConfig(config) {
            localStorage.setItem('install_config', JSON.stringify(config));
        }
        
        // 工具函数：清除安装数据
        function clearInstallData() {
            localStorage.removeItem('install_step');
            localStorage.removeItem('install_config');
        }

        // API调用函数
        async function apiCall(url, data = null) {
            const options = {
                method: data ? 'POST' : 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            const response = await fetch(url, options);
            return await response.json();
        }
        
        // Windows 风格弹窗组件
        function showModal(options) {
            return new Promise((resolve) => {
                const {
                    title = InstallI18n.tip,
                    message = '',
                    type = 'info', // info, warning, error, success
                    buttons = [{ text: InstallI18n.btn_ok, primary: true }]
                } = options;
                
                // 创建遮罩层
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                
                // 创建弹窗
                const dialog = document.createElement('div');
                dialog.className = 'modal-dialog';
                
                // 图标映射
                const iconMap = {
                    info: { icon: 'ℹ', class: 'info' },
                    warning: { icon: '⚠', class: 'warning' },
                    error: { icon: '✕', class: 'error' },
                    success: { icon: '✓', class: 'success' }
                };
                
                const iconInfo = iconMap[type] || iconMap.info;
                
                // 创建标题栏
                const header = document.createElement('div');
                header.className = 'modal-header';
                header.innerHTML = `
                    <div class="modal-icon ${iconInfo.class}">${iconInfo.icon}</div>
                    <div class="modal-title">${title}</div>
                `;
                
                // 创建内容区
                const body = document.createElement('div');
                body.className = 'modal-body';
                // 支持多行文本（保留换行）
                const messageHtml = message.replace(/\n/g, '<br>');
                body.innerHTML = `<pre>${messageHtml}</pre>`;
                
                // 创建按钮区
                const footer = document.createElement('div');
                footer.className = 'modal-footer';
                
                buttons.forEach((btn, index) => {
                    const button = document.createElement('button');
                    button.className = `btn ${btn.primary ? 'btn-primary' : 'btn-secondary'}`;
                    button.textContent = btn.text;
                    button.onclick = () => {
                        document.body.removeChild(overlay);
                        resolve(btn.value !== undefined ? btn.value : index);
                    };
                    footer.appendChild(button);
                });
                
                // 组装弹窗
                dialog.appendChild(header);
                dialog.appendChild(body);
                dialog.appendChild(footer);
                overlay.appendChild(dialog);
                
                // 点击遮罩层关闭（如果只有一个按钮）
                if (buttons.length === 1 && buttons[0].primary) {
                    overlay.onclick = (e) => {
                        if (e.target === overlay) {
                            document.body.removeChild(overlay);
                            resolve(0);
                        }
                    };
                }
                
                // 添加到页面
                document.body.appendChild(overlay);
                
                // 聚焦第一个按钮
                setTimeout(() => {
                    const firstBtn = footer.querySelector('.btn-primary') || footer.querySelector('.btn');
                    if (firstBtn) {
                        firstBtn.focus();
                    }
                }, 100);
            });
        }
        
        // 简化的 alert 替代函数
        async function showAlert(message, title = InstallI18n.tip, type = 'info') {
            await showModal({
                title,
                message,
                type,
                buttons: [{ text: InstallI18n.btn_ok, primary: true }]
            });
        }
        
        // 简化的 confirm 替代函数
        async function showConfirm(message, title = InstallI18n.confirm_title) {
            return await showModal({
                title,
                message,
                type: 'warning',
                buttons: [
                    { text: InstallI18n.btn_cancel, primary: false, value: false },
                    { text: InstallI18n.btn_ok, primary: true, value: true }
                ]
            });
        }

                        </div>
                        <div class="language-option" onclick="selectLanguage('en')">
                            <input type="radio" name="language" value="en" id="lang-en">
                            <label for="lang-en">English</label>
                        </div>
                    </div>
                </div>
                
                <div class="btn-container">
                    <button class="btn btn-primary" onclick="handleLanguageConfirm()">${InstallI18n.btn_next}</button>
                </div>
            `;
            
            document.getElementById('installContent').innerHTML = html;
            selectLanguage('zh-CN');
        }
        
        function selectLanguage(lang) {
            document.querySelectorAll('.language-option').forEach(el => el.classList.remove('selected'));
            const option = document.querySelector(`.language-option[onclick="selectLanguage('${lang}')"]`);
            if (option) option.classList.add('selected');
            document.getElementById(`lang-${lang}`).checked = true;
        }
        
        function handleLanguageConfirm() {
            const lang = document.querySelector('input[name="language"]:checked').value;
            // 保存语言到安装配置（后续会随 create-admin 写入注册表）
            let config = getInstallConfig();
            if (!config) config = {};
            config.language = lang;
            saveInstallConfig(config);
            setCurrentStep(InstallState.STEP_AGREEMENT);
            showStatusAndAutoRefresh(lang === 'zh-CN' ? '语言已选择，即将进入协议步骤...' : 'Language selected, entering agreement step...', InstallState.STEP_AGREEMENT);
        }

        async function addPartition() {
            // 防止重复点击
            if (isAddingPartition) {
                return;
            }
            
            const name = document.getElementById('newPartitionName').value;
            const sizeStr = document.getElementById('newPartitionSize').value;
            
            if (!name || !sizeStr) {
                await showAlert('请填写完整的分区信息 / Please fill in partition name and size.', InstallI18n.error_input, 'warning');
                return;
            }
            
            const size = parseBytes(sizeStr);
            if (!size || size <= 0) {
                await showAlert('请输入有效的分区大小（例如：1GB, 500MB） / Enter valid size (e.g. 1GB, 500MB).', InstallI18n.error_input, 'warning');
                return;
            }
            
            let allocated = 0;
            Object.values(window.partitions).forEach(s => allocated += s);
            
            if (allocated + size > window.totalSize) {
                await showAlert(`分区总大小不能超过 ${formatBytes(window.totalSize)} / Total size cannot exceed ${formatBytes(window.totalSize)}.`, '分区大小错误 / Invalid size', 'warning');
                return;
            }
            
            // 设置处理中标志
            isAddingPartition = true;
            
            // 禁用按钮并显示加载状态
            const addBtn = document.querySelector('.add-partition-form button');
            const originalText = addBtn ? addBtn.textContent : '';
            if (addBtn) {
                addBtn.disabled = true;
                addBtn.textContent = '添加中... / Adding...';
                addBtn.style.opacity = '0.6';
                addBtn.style.cursor = 'not-allowed';
            }
            
            // 模拟网络延迟（实际是本地操作，但保持一致性）
            setTimeout(() => {
                try {
                    window.partitions[name] = size;
                    window.renderPartitions();
                    
                    // 重新生成分区选项
                    const select = document.getElementById('newPartitionName');
                    select.innerHTML = generatePartitionOptionsForSelect(window.partitions);
                    document.getElementById('newPartitionSize').value = '';
                } finally {
                    // 恢复按钮状态
                    isAddingPartition = false;
                    if (addBtn) {
                        addBtn.disabled = false;
                        addBtn.textContent = originalText;
                        addBtn.style.opacity = '1';
                        addBtn.style.cursor = 'pointer';
                    }
                }
            }, 300); // 短暂延迟，确保UI更新
        }
        
        async function updatePartitionSize(name, sizeStr) {
            const size = parseBytes(sizeStr);
            if (!size || size <= 0) {
                await showAlert('请输入有效的分区大小 / Enter valid partition size.', InstallI18n.error_input, 'warning');
                window.renderPartitions();
                return;
            }
            
            let allocated = 0;
            Object.entries(window.partitions).forEach(([n, s]) => {
                if (n !== name) allocated += s;
            });
            
            if (allocated + size > window.totalSize) {
                await showAlert(`分区总大小不能超过 ${formatBytes(window.totalSize)} / Total cannot exceed ${formatBytes(window.totalSize)}.`, '分区大小错误 / Invalid size', 'warning');
                window.renderPartitions();
                return;
            }
            
            window.partitions[name] = size;
        }

                b = ii(b, c, d, a, k[5], 21, -57434055);
                a = ii(a, b, c, d, k[12], 6, 1700485571);
                d = ii(d, a, b, c, k[3], 10, -1894986606);
                c = ii(c, d, a, b, k[10], 15, -1051523);
                b = ii(b, c, d, a, k[1], 21, -2054922799);
                a = ii(a, b, c, d, k[8], 6, 1873313359);
                d = ii(d, a, b, c, k[15], 10, -30611744);
                c = ii(c, d, a, b, k[6], 15, -1560198380);
                b = ii(b, c, d, a, k[13], 21, 1309151649);
                a = ii(a, b, c, d, k[4], 6, -145523070);
                d = ii(d, a, b, c, k[11], 10, -1120210379);
                c = ii(c, d, a, b, k[2], 15, 718787259);
                b = ii(b, c, d, a, k[9], 21, -343485551);
                
                x[0] = add32(a, x[0]);
                x[1] = add32(b, x[1]);
                x[2] = add32(c, x[2]);
                x[3] = add32(d, x[3]);
            }
            
            function cmn(q, a, b, x, s, t) {
                a = add32(add32(a, q), add32(x, t));
                return add32((a << s) | (a >>> (32 - s)), b);
            }
            
            function ff(a, b, c, d, x, s, t) {
                return cmn((b & c) | ((~b) & d), a, b, x, s, t);
            }
            
            function gg(a, b, c, d, x, s, t) {
                return cmn((b & d) | (c & (~d)), a, b, x, s, t);
            }
            
            function hh(a, b, c, d, x, s, t) {
                return cmn(b ^ c ^ d, a, b, x, s, t);
            }
            
            function ii(a, b, c, d, x, s, t) {
                return cmn(c ^ (b | (~d)), a, b, x, s, t);
            }
            
            function add32(a, b) {
                return (a + b) & 0xFFFFFFFF;
            }
            
            function rhex(n) {
                let s = '';
                const hexChr = '0123456789abcdef';
                for (let i = 0; i < 4; i++) {
                    s += hexChr.charAt((n >> (i * 8 + 4)) & 0x0F) + hexChr.charAt((n >> (i * 8)) & 0x0F);
                }
                return s;
            }
            
            function hex(x) {
                const result = [];
                for (let i = 0; i < x.length; i++) {
                    result.push(rhex(x[i]));
                }
                return result.join('');
            }
            
            // 转换为 UTF-8 字节数组
            const utf8 = unescape(encodeURIComponent(data));
            const bytes = [];
            for (let i = 0; i < utf8.length; i++) {
                bytes.push(utf8.charCodeAt(i));
            }
            
            // 填充
            const len = bytes.length;
            bytes.push(0x80);
            while (bytes.length % 64 !== 56) {
                bytes.push(0);
            }
            
            // 添加长度（64位，小端序）
            const bitLen = len * 8;
            for (let i = 0; i < 8; i++) {
                bytes.push((bitLen >>> (i * 8)) & 0xFF);
            }
            
            // 初始化 MD5 缓冲区
            let h = [1732584193, -271733879, -1732584194, 271733878];
            
            // 处理每个 512 位块
            for (let i = 0; i < bytes.length; i += 64) {
                const chunk = [];
                for (let j = 0; j < 16; j++) {
                    chunk[j] = bytes[i + j * 4] | (bytes[i + j * 4 + 1] << 8) | 
                              (bytes[i + j * 4 + 2] << 16) | (bytes[i + j * 4 + 3] << 24);
                }
                md5cycle(h, chunk);
            }
            
            return hex(h);
        }
        
        // 步骤5：用户设置
        function renderUserSetupStep() {
            const html = `
                <h2 class="step-title">${InstallI18n.step_user_title}</h2>
                <p class="step-description">${InstallI18n.step_user_desc}</p>
                
                <div class="user-form">
                    <div class="form-group">
                        <label>${InstallI18n.step_user_username}</label>
                        <input type="text" id="usernameInput" placeholder="${InstallI18n.step_user_username_placeholder}">
                        <div class="form-hint">${InstallI18n.step_user_username_hint}</div>
                    </div>
                    
                    <div class="form-group">
                        <label>${InstallI18n.step_user_password}</label>
                        <input type="password" id="passwordInput" placeholder="${InstallI18n.step_user_password_placeholder}">
                        <div class="form-hint">${InstallI18n.step_user_password_hint}</div>
                    </div>
                    
                    <div class="form-group">
                        <label>${InstallI18n.step_user_confirm_pwd}</label>
                        <input type="password" id="passwordConfirmInput" placeholder="${InstallI18n.step_user_confirm_placeholder}">
                    </div>
                </div>
                
                <div class="btn-container">
                    <button class="btn btn-secondary" onclick="location.reload()">${InstallI18n.btn_reload}</button>
                    <button class="btn btn-primary" onclick="handleUserConfirm()">${InstallI18n.btn_next}</button>
                </div>
            `;
            
            document.getElementById('installContent').innerHTML = html;
        }
        
        // 用户创建状态标志
        let isCreatingUser = false;
        
        async function handleUserConfirm() {
            // 防止重复点击
            if (isCreatingUser) {
                return;
            }
            
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const passwordConfirm = document.getElementById('passwordConfirmInput').value;
            
            if (!username || !/^[a-zA-Z][a-zA-Z0-9_]*$/.test(username)) {
                await showAlert('用户名只能包含英文字母、数字和下划线，且必须以字母开头 / Username: letters, numbers, underscore; must start with a letter.', InstallI18n.error_input, 'warning');
                return;
            }
            
            if (!password) {
                await showAlert('密码不能为空 / Password is required.', InstallI18n.error_input, 'warning');
                return;
            }
            
            if (password !== passwordConfirm) {
                await showAlert('两次输入的密码不一致 / Passwords do not match.', InstallI18n.error_input, 'warning');
                return;
            }
            
            const config = getInstallConfig();
            const baseUrl = `${window.location.protocol}//${window.location.hostname}:${config.port}`;
            const serviceUrl = 'install-service.php';
            const language = (config && config.language) ? config.language : 'zh-CN';
            
            // 设置处理中标志
            isCreatingUser = true;
            
            // 禁用按钮并显示加载状态
            const confirmBtn = document.querySelector('.btn-container .btn-primary');
            const originalText = confirmBtn ? confirmBtn.textContent : '';
            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.textContent = '正在创建用户... / Creating user...';
                confirmBtn.style.opacity = '0.6';
                confirmBtn.style.cursor = 'not-allowed';
            }
            
            // 在JS端对密码进行MD5加密（与CryptDrive._md5Hash逻辑100%一致）
            const passwordMd5 = md5Hash(password);
            
            try {
                const result = await apiCall(serviceUrl, {
                    action: 'create-admin',
                    username: username,
                    password: passwordMd5,
                    language: language
                });
                
                if (result.status === 'success') {
                    setCurrentStep(InstallState.STEP_COMPLETE);
                    showStatusAndAutoRefresh('用户创建成功，即将进入完成页面... / User created, entering completion...', InstallState.STEP_COMPLETE);
                } else {
                    await showAlert(`用户创建失败：${result.message} / User creation failed: ${result.message}`, '创建失败 / Failed', 'error');
                    // 恢复按钮状态
                    isCreatingUser = false;
                    if (confirmBtn) {
                        confirmBtn.disabled = false;
                        confirmBtn.textContent = originalText;
                        confirmBtn.style.opacity = '1';
                        confirmBtn.style.cursor = 'pointer';
                    }
                }
            } catch (error) {
                await showAlert(`用户创建失败：${error.message} / User creation failed: ${error.message}`, '创建失败 / Failed', 'error');
                // 恢复按钮状态
                isCreatingUser = false;
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = originalText;
                    confirmBtn.style.opacity = '1';
                    confirmBtn.style.cursor = 'pointer';
                }
            }
        }
        
        // 步骤6：完成安装
        async function renderCompleteStep() {
            const config = getInstallConfig();
            const baseUrl = `${window.location.protocol}//${window.location.hostname}:${config.port}`;
            const serviceUrl = 'install-service.php';
            
            const html = `
                <div class="completion-message">
                    <div class="completion-icon">✓</div>
                    <h2 class="completion-title">${InstallI18n.step_complete_title}</h2>
                    <p class="completion-description">
                        ${InstallI18n.step_complete_desc}
                    </p>
                    
                    <div class="completion-info">
                        <h4>${InstallI18n.step_complete_next}</h4>
                        <p>${InstallI18n.step_complete_1}</p>
                        <p>${InstallI18n.step_complete_2}</p>
                        <p style="margin-left: 20px; color: #0078d4; font-weight: 600;">
                            ${baseUrl}/test/index.html
                        </p>
                        <p>${InstallI18n.step_complete_3}</p>
                    </div>
                    
                    <div class="btn-container">
                        <button class="btn btn-primary" id="finishBtn" onclick="handleFinishInstall('${baseUrl}', '${serviceUrl}')">${InstallI18n.step_finish_btn}</button>
                    </div>
                </div>
            `;
            
            document.getElementById('installContent').innerHTML = html;
        }
        
        async function handleFinishInstall(baseUrl, serviceUrl) {
            const btn = document.getElementById('finishBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '正在清理安装文件... / Cleaning up...';
            }
            
            // 清理安装文件
            try {
                const result = await apiCall(serviceUrl, {
                    action: 'cleanup'
                });
                console.log('清理结果：', result);
                
                // 清理完成后，清除本地存储并跳转
                clearInstallData();
                
                // 延迟一下，确保用户看到清理完成
                if (btn) {
                    btn.textContent = '清理完成，正在跳转... / Done, redirecting...';
                }
                setTimeout(() => {
                    location.href = baseUrl + '/test/index.html';
                }, 500);
            } catch (error) {
                console.error('清理失败：', error);
                // 即使清理失败，也清除本地存储并跳转
                clearInstallData();
                if (btn) {
                    btn.textContent = '清理失败，正在跳转... / Cleanup failed, redirecting...';
                }
                await showAlert('清理安装文件时出现错误，但安装已完成。您可以稍后手动删除安装目录。\n\nCleanup had errors but installation is complete. You may delete the setup folder later.\n\n正在跳转到系统... / Redirecting...', '清理警告 / Cleanup warning', 'warning');
                setTimeout(() => {
                    location.href = baseUrl + '/test/index.html';
                }, 1000);
            }
        }
        
        // 显示状态并自动刷新到下一步
        function showStatusAndAutoRefresh(statusText, nextStep, delay = 5000) {
            // 隐藏按钮容器
            const btnContainer = document.querySelector('.btn-container');
            if (btnContainer) {
                btnContainer.style.display = 'none';
            }
            
            // 显示状态提示
            let countdown = delay / 1000;
            const hintHtml = `
                <div class="auto-next-hint">
                    ${statusText} <span class="countdown">${countdown}</span> 秒后自动进入下一步... / Auto-continue in <span class="countdown">${countdown}</span> sec
                </div>
            `;
            const contentDiv = document.getElementById('installContent');
            
            // 移除旧的提示（如果存在）
            const oldHint = document.getElementById('autoNextHint');
            if (oldHint) {
                oldHint.remove();
            }
            
            const hintDiv = document.createElement('div');
            hintDiv.id = 'autoNextHint';
            hintDiv.innerHTML = hintHtml;
            contentDiv.appendChild(hintDiv);
            
            // 滚动到提示区域
            hintDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 更新倒计时
            const countdownInterval = setInterval(() => {
                countdown--;
                const countdownEl = document.querySelector('.countdown');
                if (countdownEl) {
                    countdownEl.textContent = countdown;
                }
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    location.reload();
                }
            }, 1000);
        }
        
        // 主函数：根据当前步骤渲染相应界面
        function init() {
            // 显示加载动画
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) {
                // 显示加载动画3秒
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        renderStep();
                    }, 500);
                }, 3000);
            } else {
                renderStep();
            }
        }
        
        function renderStep() {
            const step = getCurrentStep();
            
            switch (step) {
                case InstallState.STEP_LANGUAGE:
                    renderLanguageStep();
                    break;
                case InstallState.STEP_AGREEMENT:
                    renderAgreementStep();
                    break;
                case InstallState.STEP_ENV_SELECT:
                    renderEnvSelectStep();
                    break;
                case InstallState.STEP_EXTRACT:
                    renderExtractStep();
                    break;
                case InstallState.STEP_DISK_INIT:
                    renderDiskInitStep();
                    break;
                case InstallState.STEP_USER_SETUP:
                    renderUserSetupStep();
                    break;
                case InstallState.STEP_COMPLETE:
                    renderCompleteStep();
                    break;
                default:
                    renderLanguageStep();
                    break;
            }
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
